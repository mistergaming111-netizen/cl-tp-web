<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OP: ZERO-DAY - Mission Failed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/x-icon" href="../assets/icons/cyber-security.webp">
</head>
<body class="in-pages">

  <main class="game-container">
    <header class="scene-header">
      <div class="scene-illustration">
        <img src="../assets/icons/game-over.webp" alt="Game Over" class="header-img">
      </div>
      <h1 class="title" style="color: var(--accent-color);"><i class="fa-solid fa-skull"></i> ÉCHEC DE MISSION</h1>
      <p class="subtitle" style="color: var(--accent-color);">[ACCESS DENIED - IP BANNED]</p>
    </header>

    <section class="scene-body" style="border-left-color: var(--accent-color);">
      <p class="description">
        Votre attaque a été interceptée par le SOC. Votre adresse IP a été bannie définitivement et les journaux de connexion ont été transmis aux autorités.
      </p>
      <p class="description">
        <strong>Conseil :</strong> Soyez plus discret lors de votre prochaine tentative !
      </p>
    </section>

    <nav class="choices-container">
      <a href="../index.html" class="btn-choice">
        <i class="fa-solid fa-rotate-right icon"></i> Recommencer la mission
      </a>
    </nav>
  </main>

</body>
</html>
